<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamGuard Pro - Phishing & Fake Offer Inspector</title>
    <!-- Tailwind CSS CDN for Professional UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600/20 text-blue-400 p-2 rounded-xl border border-blue-500/30">
                    🛡️
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">ScamGuard Pro</h1>
                    <p class="text-xs text-slate-400">AI-Powered Recruitment & Phishing Threat Inspector</p>
                </div>
            </div>
            <div class="text-xs font-medium px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                PromptWars x Gen AI Club
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto w-full p-4 md:p-8 flex-grow space-y-6">
        
        <!-- Input Form Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Google AI Studio API Key</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Job Offer Letter or Email Content</label>
                <textarea id="offerText" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition shadow-inner" placeholder="Paste suspicious offer letter text here... (e.g., 'Dear candidate, please pay $150 via our portal for your laptop setup...')"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Suspicious Link / URL (Optional)</label>
                <input type="text" id="offerUrl" placeholder="https://example-careers-portal.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition shadow-inner">
            </div>

            <button onclick="analyzeOffer()" id="scanBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-blue-500/20 active:scale-[0.99] flex items-center justify-center space-x-2">
                <span>Run Deep Scam Inspection</span>
            </button>
        </div>

        <!-- Professional Results Card (Initially Hidden) -->
        <div id="resultsBox" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
            
            <!-- Top Threat Meter Bar -->
            <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 gap-4">
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Security Assessment</span>
                    <h3 id="riskTitle" class="text-xl font-bold text-white mt-0.5">Analyzing Threat Vector...</h3>
                </div>
                <div class="flex items-center space-x-4 bg-slate-950 border border-slate-800 px-5 py-3 rounded-xl">
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Scam Threat Index</div>
                        <div id="threatScore" class="text-3xl font-black text-red-500">0%</div>
                    </div>
                </div>
            </div>

            <!-- Executive Summary -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Executive Summary</h4>
                <p id="aiSummary" class="text-sm text-slate-300 bg-slate-950 p-4 rounded-xl border border-slate-800/80 leading-relaxed"></p>
            </div>

            <!-- Red Flags Breakdown -->
            <div class="space-y-3">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Identified Risk Indicators</h4>
                <div id="redFlagsList" class="space-y-2">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        ScamGuard Pro • Built for Hackathon Submission
    </footer>

    <!-- Script Logic -->
    <script>
        async function analyzeOffer() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const text = document.getElementById('offerText').value.trim();
            const url = document.getElementById('offerUrl').value.trim();
            const resultsBox = document.getElementById('resultsBox');
            const scanBtn = document.getElementById('scanBtn');

            if (!apiKey) {
                alert("Please enter your Google AI Studio API key.");
                return;
            }
            if (!text && !url) {
                alert("Please enter job offer text or a URL to analyze.");
                return;
            }

            // UI Loading state
            scanBtn.disabled = true;
            scanBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Inspecting Threat Vectors...`;

            resultsBox.classList.remove('hidden');
            document.getElementById('riskTitle').innerText = "Running Deep Scan...";
            document.getElementById('threatScore').innerText = "--%";
            document.getElementById('aiSummary').innerText = "Consulting Gemini AI security models...";
            document.getElementById('redFlagsList').innerHTML = '';

            const prompt = `You are a cybersecurity expert analyzing recruitment scams and phishing. Evaluate this text and URL for indicators. You must return a strict JSON response with NO markdown code block formatting outside the structure:
            {
              "threatScore": <integer between 0 and 100>,
              "riskLevel": "<Safe / High Risk / Critical Scam>",
              "aiSummary": "<Professional paragraph summarizing why this offer is safe or fraudulent>",
              "detectedRedFlags": [
                {"category": "<Category Name e.g. Payment Demand>", "detail": "<Detailed explanation>"}
              ]
            }

            Text: ${text}
            URL: ${url}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'API Error');
                }

                const rawText = data.candidates[0].content.parts[0].text;
                const cleanedText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const result = JSON.parse(cleanedText);

                // Populate UI
                document.getElementById('threatScore').innerText = result.threatScore + '%';
                document.getElementById('riskTitle').innerText = result.riskLevel;
                document.getElementById('aiSummary').innerText = result.aiSummary;

                const scoreEl = document.getElementById('threatScore');
                if (result.threatScore > 75) {
                    scoreEl.className = "text-3xl font-black text-red-500";
                } else if (result.threatScore > 30) {
                    scoreEl.className = "text-3xl font-black text-amber-500";
                } else {
                    scoreEl.className = "text-3xl font-black text-emerald-500";
                }

                const flagsContainer = document.getElementById('redFlagsList');
                if (result.detectedRedFlags && result.detectedRedFlags.length > 0) {
                    result.detectedRedFlags.forEach(f => {
                        flagsContainer.innerHTML += `
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-start space-x-3 text-xs">
                                <span class="text-red-400 font-bold mt-0.5 min-w-[120px]">${f.category}:</span>
                                <span class="text-slate-300">${f.detail}</span>
                            </div>`;
                    });
                } else {
                    flagsContainer.innerHTML = `<div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-emerald-400">No major threat indicators detected.</div>`;
                }

            } catch (error) {
                document.getElementById('riskTitle').innerText = "Inspection Failed";
                document.getElementById('aiSummary').innerText = "Error: " + error.message;
            } finally {
                scanBtn.disabled = false;
                scanBtn.innerHTML = `<span>Run Deep Scam Inspection</span>`;
            }
        }
    </script>
</body>
</html>
